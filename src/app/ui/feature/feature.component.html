<entity
  type="spell"
  [reference]="feature().reference"
  [found]="feature().common.found"
  [version]="feature()!.common.version.short"
  [(collapsed)]="collapsed"
  (full)="onFull()"
  [overview]="overview()"
>
  <div name class="name">{{ feature().name }}</div>

  <div subtitle>
    {{ feature().type }}
  </div>

  @if (feature().prerequisites.length > 0) {
    <labeled-text label="Prerequisites">{{ feature().prerequisites | list }}</labeled-text>
  }
  @if (feature().blockers.length > 0) {
    <labeled-text label="Blockers">{{ feature().blockers | list }}</labeled-text>
  }
  @if (feature().triggers.length > 0) {
    <labeled-text label="Triggers">{{ feature().triggers | list }}</labeled-text>
  }

  <div content>
    <div class="description formatted">
      <formatted-text [texts]="feature().common.descriptions"></formatted-text>
    </div>
  </div>
</entity>
