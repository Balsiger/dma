<mat-toolbar color="primary">
  <a href="/">
    DMA
    @if (isDev) {
      (DEV)
    }
  </a>
  @if (userService.isLoggedIn()) {
    <button mat-icon-button (click)="onSettings()">
      <img class="user-image" [src]="userService.photoURL()" [matTooltip]="userService.email() || ''" />
    </button>
  } @else {
    <button mat-flat-button color="accent" (click)="onLogin()">Login</button>
  }
</mat-toolbar>
