@let groupEntity = group();
@if (groupEntity) {
  <entity-card
    [flippable]="flippable()"
    [imageIndex]="imageIndex()"
    [name]="groupEntity.name"
    [image]="groupEntity.common.images.length > 0 ? groupEntity.common.images[0].url : ''"
    [tagline]="groupEntity.shortDescription"
    [references]="groupEntity.reference.toString()"
  >
    <div description>
      @for (rank of group()?.ranks; track rank.renown; let i = $index) {
        <b>{{ rank.renown }} </b>&mdash;
        @if (i == 0 || rank.title !== group()?.ranks[i - 1].title) {
          <b>{{ rank.title }}</b> &mdash;
        }
        <span class="reward"> <formatted-text [text]="rank.reward" /> </span><br />
      }
    </div>
  </entity-card>
}
