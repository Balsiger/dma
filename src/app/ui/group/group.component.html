<entity
  type="spell"
  [reference]="group().reference"
  [found]="group().common.found"
  [version]="group()!.common.version.short"
  [(collapsed)]="collapsed"
  (full)="onFull()"
  [overview]="overview()"
>
  <div name class="name">{{ group().name }}</div>

  <div subtitle></div>

  @if (group().common.version === Version.DND_5) {
    <labeled-text label="Duration"> </labeled-text>
  } @else {
    <labeled-text label="Casting Time"> </labeled-text>
  }
  <labeled-text label="Sound"> </labeled-text>

  @if (group().common.version === Version.DND_5) {
    <taper></taper>
  }

  <div content>
    <div class="description formatted">
      <formatted-text [text]="group().shortDescription"></formatted-text>
    </div>
  </div>
</entity>
