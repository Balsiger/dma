@if (campaign()) {
  <expanding-box>
    <div>
      @for (character of campaign()?.characters(); track character.name) {
        <div class="character">
          <span class="name">{{ character.name }}</span>
          <span class="level">{{ character.levelSummary() }}</span>
        </div>
      }
    </div>
    <div title class="title">
      <div class="text">Party</div>
      <button mat-icon-button color="primary" (click)="onCharacter()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
    <div content class="characters">
      @for (character of campaign()?.characters(); track character.name) {
        <profile-picture
          (click)="onCharacter(character)"
          [name]="character.name"
          [image]="character.profile().url"
          [character]="character"
        ></profile-picture>
      }
    </div>
  </expanding-box>
}
