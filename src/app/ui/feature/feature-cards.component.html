<h1 class="no-print">Feature Cards</h1>

@for (page of pages; track page) {
  <div class="page images">
    <div class="grid">
      @for (feature of page; track feature.name; let i = $index) {
        <feature-card [feature]="feature" [imageIndex]="i + 1"></feature-card>
      }
    </div>
  </div>

  <div class="page">
    <div class="grid">
      @for (feature of page; track feature.name) {
        <feature-card [feature]="feature"></feature-card>
      }
    </div>
  </div>
}
