@let featureEntity = feature();
@if (featureEntity) {
  <entity-card
    [flippable]="flippable()"
    [imageIndex]="imageIndex()"
    [name]="featureEntity.name"
    [image]="featureEntity.common.images.length > 0 ? featureEntity.common.images[0].url : ''"
    [tagline]="featureEntity.shortDescription"
    [references]="featureEntity.reference.toString()"
    [version]="featureEntity.common.version"
  >
    <div category>
      <img class="type-icon" [src]="'/assets/features/types/' + featureEntity.type + '.webp'" />
      <div class="type">{{ featureEntity.type }}</div>
    </div>
    <div description>
      <formatted-text [texts]="featureEntity.common.descriptions"></formatted-text>
    </div>

    <div top class="top-type">
      {{ featureEntity.type }}
    </div>
    <div top class="classes">
      @for (characterClass of featureEntity.classes; track characterClass) {
        <div class="feature-class">
          <img src="/assets/common/classes/{{ characterClass }}.webp" />
          <div class="caption">{{ characterClass }}</div>
        </div>
      }
    </div>
  </entity-card>
}
