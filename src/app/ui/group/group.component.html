<entity
  type="spell"
  [reference]="group().reference"
  [found]="group().common.found"
  [version]="group()!.common.version.short"
  [(collapsed)]="collapsed"
  (full)="onFull()"
  [overview]="overview()"
>
  <div name class="name">{{ group().name }}</div>

  <labeled-text label="Harper Renown">
    <table>
      @for (rank of group().ranks; track rank.renown) {
        <tr>
          <td>
            <b>{{ rank.renown }}</b>
          </td>
          <td>
            <b>{{ rank.title }}</b>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>{{ rank.description }}</td>
        </tr>
        @if (rank.reward) {
          <tr>
            <td></td>
            <td><b>Reward:</b> {{ rank.reward }}</td>
          </tr>
        }

        <tr></tr>
      }
    </table>
  </labeled-text>

  <div content>
    <div class="description formatted">
      <formatted-text [text]="group().shortDescription"></formatted-text>
    </div>
  </div>
</entity>
