<entity
  type="spell"
  [reference]="feature().reference"
  [found]="feature().common.found"
  [version]="feature()!.common.version.short"
  [(collapsed)]="collapsed"
  (full)="onFull()"
  [overview]="overview()"
>
  <div name class="name">{{ feature().name }}</div>

  <div subtitle>
    {{ feature().type }}
  </div>

  <div content>
    <div class="description formatted">
      <formatted-text [text]="feature().shortDescription"></formatted-text>
    </div>
  </div>
</entity>
